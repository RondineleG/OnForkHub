services:
  p2p-seeder:
    build: .
    restart: unless-stopped
    environment:
      MEDIA_DIR: /media
      METADATA_DIR: /metadata
      POLL_MS: "30000"
      WEBRTC_TRACKERS: "wss://tracker.webtorrent.dev,wss://tracker.openwebtorrent.com"
    volumes:
      - ${ONFORKHUB_VIDEO_DIR:?Set ONFORKHUB_VIDEO_DIR to the LocalFileStorageService videos directory}:/media:ro
      - ./metadata:/metadata
