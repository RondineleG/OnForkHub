networks:
  onforkhub-network:
    driver: bridge

volumes:
  sqlserver-data:

services:
  onforkhub-api:
    image: ghcr.io/rondineleg/onforkhub-api:latest
    container_name: onforkhub-api
    restart: unless-stopped
    networks:
      - onforkhub-network
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ASPNETCORE_HTTPSREDIRECTION_ENABLED=false
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=OnForkHub;User Id=sa;Password=${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env};TrustServerCertificate=True
      - Jwt__SecretKey=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env (32+ characters)}
      - Jwt__Issuer=${JWT_ISSUER:-OnForkHub.Api}
      - Jwt__Audience=${JWT_AUDIENCE:-OnForkHub.Client}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN:?set CORS_ALLOWED_ORIGIN in .env (the site origin)}
      - Database__MigrateOnStartup=true
      - Cache__UseRedis=true
      - Cache__RedisConnectionString=redis:6379
      - Jaeger__Host=jaeger
      - Jaeger__Port=4317
    depends_on:
      - sqlserver
      - redis
      - jaeger
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  onforkhub-web:
    image: ghcr.io/rondineleg/onforkhub-web:latest
    container_name: onforkhub-web
    restart: unless-stopped
    networks:
      - onforkhub-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onforkhub-sqlserver
    restart: unless-stopped
    networks:
      - onforkhub-network
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      - MSSQL_PID=Express
    volumes:
      - sqlserver-data:/var/opt/mssql
    deploy:
      resources:
        limits:
          memory: 2048M

  redis:
    image: redis:alpine
    container_name: onforkhub-redis
    restart: unless-stopped
    networks:
      - onforkhub-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: onforkhub-jaeger
    restart: unless-stopped
    networks:
      - onforkhub-network

  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./custom.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/zerossl:/etc/ssl/zerossl:ro
    networks:
      - onforkhub-network
    depends_on:
      onforkhub-api:
        condition: service_started
      onforkhub-web:
        condition: service_started
