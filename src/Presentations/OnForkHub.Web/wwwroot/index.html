<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <meta name="theme-color" content="#0a0806" />
    <script>
        // Theme before the first paint: the saved choice, else the system preference.
        (function () {
            var theme = null;
            try { theme = localStorage.getItem("onforkhub.theme"); } catch (e) { }
            if (theme !== "light" && theme !== "dark") {
                theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            }
            document.documentElement.dataset.theme = theme;
            document.querySelector("meta[name=theme-color]").content = theme === "light" ? "#F2EBD9" : "#0a0806";
        })();
    </script>
    <title>OnForkHub</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link href="css/mrbur/tokens.css" rel="stylesheet" />
    <link href="css/mrbur/base.css" rel="stylesheet" />
    <link href="css/mrbur/components.css" rel="stylesheet" />
    <link href="css/ofh.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="OnForkHub.Web.styles.css" rel="stylesheet" />
    <link href="img/logo.svg" rel="icon" type="image/svg+xml" />
    <link href="favicon.png" rel="alternate icon" type="image/png" />
</head>

<body>
    <div id="app">
        <div class="splash" role="img" aria-label="OnForkHub">

                <circle class="brand-mark-orbit" cx="32" cy="32" r="24" />
                <path class="brand-mark-spokes" d="M45 32L51.4 32M41.19 41.19L45.72 45.72M32 45L32 51.4M22.81 41.19L18.28 45.72M19 32L12.6 32M22.81 22.81L18.28 18.28M32 19L32 12.6M41.19 22.81L45.72 18.28" />
                <circle class="brand-mark-peer" cx="56" cy="32" r="3.1" />
                <circle class="brand-mark-peer" cx="48.97" cy="48.97" r="3.1" />
                <circle class="brand-mark-peer" cx="32" cy="56" r="3.1" />
                <circle class="brand-mark-peer" cx="15.03" cy="48.97" r="3.1" />
                <circle class="brand-mark-peer" cx="8" cy="32" r="3.1" />
                <circle class="brand-mark-peer" cx="15.03" cy="15.03" r="3.1" />
                <circle class="brand-mark-peer" cx="32" cy="8" r="3.1" />
                <circle class="brand-mark-peer" cx="48.97" cy="15.03" r="3.1" />
                <circle class="brand-mark-hub" cx="32" cy="32" r="11" />
                <path class="brand-mark-play" d="M28.6 26.2Q28.6 24.6 30 25.4L37.8 30.9Q39.2 32 37.8 33.1L30 38.6Q28.6 39.4 28.6 37.8Z" />
            </svg>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro inesperado.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
