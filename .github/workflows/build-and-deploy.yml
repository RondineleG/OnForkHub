name: Build and Deploy to VPS with HTTPS

on:
  workflow_dispatch:
    inputs:
      branch_type:
        description: 'Select branch type'
        required: true
        type: choice
        options:
          - feature/
          - bugfix/
          - hotfix/
          - release/
          - dev
          - main
          - uat
      branch_name:
        description: 'Branch name (required for feature/bugfix/hotfix/release, ex: for feature/user-auth just type user-auth)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - dev
      - main
      - uat

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: onforkhub-api
  WEB_IMAGE_NAME: onforkhub-web
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      full_branch: ${{ steps.set-branch.outputs.full_branch }}

    steps:
      - name: Set full branch name
        id: set-branch
        if: github.event_name == 'workflow_dispatch'
        env:
          BRANCH_TYPE: ${{ inputs.branch_type }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          if [[ "$BRANCH_TYPE" == "dev" || "$BRANCH_TYPE" == "main" || "$BRANCH_TYPE" == "uat" ]]; then
            FULL_BRANCH="$BRANCH_TYPE"
          else
            if [[ -z "$BRANCH_NAME" || "$BRANCH_NAME" == *$'\\n'* || "$BRANCH_NAME" == -* ]]; then
              echo "Invalid branch name"
              exit 1
            fi
            FULL_BRANCH="${BRANCH_TYPE%/}/${BRANCH_NAME#/}"
          fi
          echo "FULL_BRANCH=$FULL_BRANCH" >> "$GITHUB_ENV"
          echo "full_branch=$FULL_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.set-branch.outputs.full_branch || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.OnForkHub.Api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/Dockerfile.OnForkHub.Web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get current UTC time
        id: current-time
        if: failure()
        run: echo "time=$(date -u '+%d/%m/%Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Notify Build Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            🔔 *Build Failure Notification*

            📦 *Build Job Failed*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Author: [${{ github.actor }}](https://github.com/${{ github.actor }})

            🏗️ *Build Details:*
            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}

            [View Build Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ⏰ ${{ steps.current-time.outputs.time }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.full_branch || github.ref }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

          cat >> ~/.ssh/config << 'EOF'
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USERNAME }}
            IdentityFile ~/.ssh/deploy_key
            ServerAliveInterval 30
            ServerAliveCountMax 10
            ConnectTimeout 10
          EOF

          echo "✅ SSH configured successfully"

      - name: Test SSH Connection
        run: |
          ssh deploy-server "echo '✅ SSH connection successful'"

      - name: Check SSL Certificate Status
        run: |
          ssh deploy-server "
            echo '🔐 Checking SSL certificate status...'
            if [ -f '/etc/ssl/zerossl/fullchain.crt' ]; then
              echo '✅ SSL certificate found'
              openssl x509 -in /etc/ssl/zerossl/fullchain.crt -subject -dates -noout
              if openssl x509 -in /etc/ssl/zerossl/fullchain.crt -checkend 86400 -noout; then
                echo '✅ Certificate is valid for more than 24 hours'
              else
                echo '⚠️ Certificate expires within 24 hours!'
              fi
            else
              echo '❌ SSL certificate not found'
              exit 1
            fi
          "

      - name: Copy Deployment Files
        run: |
          scp -r .deploy/* deploy-server:~/onforkhub-deploy/

      - name: Install Services if Needed
        run: |
          ssh deploy-server "
            cd ~/onforkhub-deploy
            chmod +x install-services.sh
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo 'Installing Docker and dependencies...'
              export SUDO_PASSWORD='${{ secrets.SUDO_PASSWORD }}'
              timeout 300 bash ./install-services.sh
            else
              echo 'Docker already installed'
              docker --version
              docker compose version
            fi
          "

      - name: Pin deployment images to validated commit
        env:
          IMAGE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LOWER="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
          ssh deploy-server "mkdir -p ~/onforkhub-deploy"
          ssh deploy-server "cd ~/onforkhub-deploy && if [ -f docker-compose.yml ]; then cp docker-compose.yml docker-compose.previous.yml; fi"
          scp .deploy/docker-compose.yml deploy-server:~/onforkhub-deploy/docker-compose.yml
          ssh deploy-server "cd ~/onforkhub-deploy && sed -i -E 's#ghcr.io/[^/]+/onforkhub-api:[^ ]+#ghcr.io/$OWNER_LOWER/onforkhub-api:$IMAGE_SHA#; s#ghcr.io/[^/]+/onforkhub-web:[^ ]+#ghcr.io/$OWNER_LOWER/onforkhub-web:$IMAGE_SHA#' docker-compose.yml"

      - name: Start Deployment
        run: |
          ssh deploy-server "
            cd ~/onforkhub-deploy
            chmod +x start-services.sh
            export ASPNETCORE_ENVIRONMENT='${{ github.ref_name == 'main' && 'Production' || 'Development' }}'
            echo '🚀 Starting deployment...'
            timeout 600 bash ./start-services.sh '${{ secrets.CONTAINER_REGISTRY_TOKEN }}' '${{ github.actor }}' || {
              echo '❌ Deployment timed out or failed'
              echo 'Container status:'
              docker ps -a || true
              exit 1
            }
          "

      - name: Monitor Deployment Progress
        run: |
          ssh deploy-server "
            cd ~/onforkhub-deploy
            echo '⏳ Monitoring deployment progress...'

            for i in {1..20}; do
              echo \"--- Check \$i/20 ---\"
              docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

              # Check if containers are running
              API_STATUS=\$(docker ps --filter 'name=onforkhub-api' --format '{{.Status}}' | head -1)
              WEB_STATUS=\$(docker ps --filter 'name=onforkhub-web' --format '{{.Status}}' | head -1)
              PROXY_STATUS=\$(docker ps --filter 'name=reverse-proxy' --format '{{.Status}}' | head -1)

              echo \"API Status: \$API_STATUS\"
              echo \"Web Status: \$WEB_STATUS\"
              echo \"Proxy Status: \$PROXY_STATUS\"

              # If all containers are running, break
              if [[ \"\$API_STATUS\" == *\"Up\"* && \"\$WEB_STATUS\" == *\"Up\"* && \"\$PROXY_STATUS\" == *\"Up\"* ]]; then
                echo '✅ All containers are running'
                break
              fi

              # If any container has exited, show logs and exit
              if [[ \"\$API_STATUS\" == *\"Exited\"* || \"\$WEB_STATUS\" == *\"Exited\"* ]]; then
                echo '❌ Some containers have exited'
                docker logs onforkhub-api --tail 20 2>/dev/null || true
                docker logs onforkhub-web --tail 20 2>/dev/null || true
                exit 1
              fi

              sleep 15
            done
          "

      - name: Verify deployment health
        run: |
          ssh deploy-server '
            set -eu
            cd ~/onforkhub-deploy
            for attempt in $(seq 1 20); do
              API_HEALTH=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" onforkhub-api 2>/dev/null || true)
              WEB_HEALTH=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" onforkhub-web 2>/dev/null || true)
              if [ "$API_HEALTH" = healthy ] && [ "$WEB_HEALTH" = healthy ]; then exit 0; fi
              if [ "$API_HEALTH" = unhealthy ] || [ "$WEB_HEALTH" = unhealthy ]; then exit 1; fi
              sleep 15
            done
            echo "Deployment health deadline exceeded"
            exit 1
          '

      - name: Roll back unhealthy deployment
        if: failure()
        run: |
          ssh deploy-server '
            set -eu
            cd ~/onforkhub-deploy
            if [ ! -f docker-compose.previous.yml ]; then
              echo "No previous compose snapshot available for rollback"
              exit 1
            fi
            cp docker-compose.previous.yml docker-compose.yml
            docker compose pull onforkhub-api onforkhub-web
            docker compose up -d onforkhub-api onforkhub-web
            for attempt in $(seq 1 20); do
              API_HEALTH=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" onforkhub-api 2>/dev/null || true)
              WEB_HEALTH=$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}" onforkhub-web 2>/dev/null || true)
              if [ "$API_HEALTH" = healthy ] && [ "$WEB_HEALTH" = healthy ]; then exit 0; fi
              sleep 15
            done
            exit 1
          '

      - name: Show Deployment Logs
        if: always()
        run: |
          ssh deploy-server "
            echo '📝 Deployment logs:'
            echo '=== API Logs ==='
            docker logs onforkhub-api --tail 30 2>/dev/null || echo 'API container not found'
            echo '=== Web Logs ==='
            docker logs onforkhub-web --tail 30 2>/dev/null || echo 'Web container not found'
            echo '=== Reverse Proxy Logs ==='
            docker logs reverse-proxy --tail 30 2>/dev/null || echo 'Reverse proxy container not found'
          "

      - name: Get current UTC time
        id: current-time
        run: echo "time=$(date -u '+%d/%m/%Y %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Notify Successful Deployment
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            🎉 *HTTPS Deployment Successful*

            🔐 *Secure Deployment Completed*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}

            🌐 *HTTPS Access URLs:*
            • Web: https://172.245.152.43
            • API: https://172.245.152.43:9443

            ⏰ ${{ steps.current-time.outputs.time }}

      - name: Notify Deployment Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            🚨 *HTTPS Deployment Failed*

            ❌ *Deployment Error*
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`

            [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ⏰ ${{ steps.current-time.outputs.time }}
